# /etc/nginx/sites-available/tradedesk
# Replace news.example.com with your domain. Certbot adds the HTTPS (443) block for you.

# Rate limits: login is tight, the rest is generous
limit_req_zone $binary_remote_addr zone=td_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=td_api:10m   rate=20r/s;
limit_conn_zone $binary_remote_addr zone=td_conn:10m;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name news.example.com;

    server_tokens off;            # hide the nginx version
    client_max_body_size 20m;     # screenshots / CSV import / backup restore
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn td_conn 30;

    # Block common scanners and anything that looks like a dotfile or source file
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(env|git|sql|bak|ini|log|sh|py|php)$ { return 404; }

    location = /api/auth/login { limit_req zone=td_login burst=5 nodelay; proxy_pass http://127.0.0.1:4100; include /etc/nginx/snippets/tradedesk-proxy.conf; }
    location = /api/auth/setup { limit_req zone=td_login burst=3 nodelay; proxy_pass http://127.0.0.1:4100; include /etc/nginx/snippets/tradedesk-proxy.conf; }

    # Live news stream (Server-Sent Events): no buffering, long timeout
    location = /api/stream {
        proxy_pass http://127.0.0.1:4100;
        include /etc/nginx/snippets/tradedesk-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ { limit_req zone=td_api burst=60 nodelay; proxy_pass http://127.0.0.1:4100; include /etc/nginx/snippets/tradedesk-proxy.conf; proxy_read_timeout 60s; }
    location /     { proxy_pass http://127.0.0.1:4100; include /etc/nginx/snippets/tradedesk-proxy.conf; }
}
